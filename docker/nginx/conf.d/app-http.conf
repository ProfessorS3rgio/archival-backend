# HTTP-only config used for initial Certbot issuance and as fallback.
# After certificates are issued, enable HTTPS by renaming app-https.conf.disabled -> app-https.conf

server {
    listen 80;
    server_name sibugaydevgroup.tech www.sibugaydevgroup.tech;

    # ACME challenge (Let's Encrypt)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Temporary: serve the app over HTTP until HTTPS is enabled.
    # After enabling HTTPS, you can change this to a 301 redirect.
    location / {
        proxy_pass http://app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
