# Host Nginx configuration for the DigitalOcean droplet.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Keep HTTP certificate renewals available without serving the application.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/archival-backend/public;
        try_files $uri =404;
    }

    location / { return 301 https://sibugaydevgroup.tech$request_uri; }
}

# Raw HTTPS IP requests can show a certificate-name warning before redirecting.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name www.sibugaydevgroup.tech 152.42.229.207 _;
    ssl_certificate /etc/letsencrypt/live/sibugaydevgroup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sibugaydevgroup.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://sibugaydevgroup.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sibugaydevgroup.tech;
    ssl_certificate /etc/letsencrypt/live/sibugaydevgroup.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sibugaydevgroup.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/archival-backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 100m;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    # PDF.js uses an ES module worker; browsers reject octet-stream module scripts.
    location ~* ^/build/assets/[a-z0-9_-][a-z0-9_.-]*\.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
