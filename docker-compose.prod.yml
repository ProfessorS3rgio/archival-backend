services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - mysql
    environment:
      - APP_KEY=${APP_KEY:-}
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-archival_system}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      # Safer production default: do NOT auto-run migrations/seed on every restart.
      - RUN_MIGRATIONS_ON_STARTUP=${RUN_MIGRATIONS_ON_STARTUP:-false}
      - RUN_SEED_ON_STARTUP=${RUN_SEED_ON_STARTUP:-false}
    volumes:
      # Persist uploaded files/logs/cache across container recreation
      - app_storage:/var/www/html/storage
    restart: unless-stopped
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    # No published ports in production (DB stays private inside Docker network)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-archival_system}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql_data:
  app_storage:

networks:
  app-network:
    driver: bridge
